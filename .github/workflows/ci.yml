name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Apple retired the Intel runner image, so an x64 leg would wait a day for a
  # machine that never comes and then be cancelled. Intel builds are cross-compiled
  # or built from source instead; neither is automated here yet.
  verify:
    name: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  package:
    name: package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Developer ID signing and notarization read their credentials from the
      # environment. Without them electron-builder logs "skipped macOS application
      # code signing" and produces a DMG that Gatekeeper will question; the
      # release notes tell the downloader what to do about that.
      #
      # An unset secret arrives as an empty variable, and electron-builder reads an
      # empty CSC_LINK as a certificate path relative to the project, which fails the
      # build. The names therefore have to be absent, not blank.
      - name: Build the macOS archives
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder --mac --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMonkey-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          retention-days: 14

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenMonkey-*
          merge-multiple: true
          path: dist
      # The manifest is rebuilt from the bytes that are about to be uploaded rather
      # than carried from a build job, so it is correct whichever arches made it
      # this far.
      - run: node scripts/make-update-manifest.mjs --dir dist --version "${GITHUB_REF_NAME#v}"
      # The body lives in the repository so its wording is reviewed like anything else.
      # Appending the digests of the bytes actually built keeps the checksums honest.
      - run: |
          cp docs/RELEASE_NOTES.md notes.md
          { printf '\n## Checksums\n\n```sh\n'; (cd dist && sha256sum OpenMonkey-* latest-mac.yml); printf '```\n'; } >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "OpenMonkey $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/OpenMonkey-arm64.dmg \
            dist/OpenMonkey-arm64.dmg.blockmap \
            dist/OpenMonkey-arm64.zip \
            dist/OpenMonkey-arm64.zip.blockmap \
            dist/latest-mac.yml

  # The site is static and lives in landing/, so it publishes from that folder on
  # every change to main. Its asset paths are all relative, which is what lets it
  # sit under /OpenMonkey/ rather than at the domain root.
  pages:
    name: pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
